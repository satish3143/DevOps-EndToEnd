name: DevOps CI Pipeline


on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

# ==========================
# Backend Build and Push
# ==========================

  backend-build:

    name: Backend Docker Build

    runs-on: ubuntu-latest


    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4


    - name: Verify Backend Files
      run: |
        ls -la
        ls -la backend


    - name: Login Docker Hub
      uses: docker/login-action@v3

      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}


    - name: Build Backend Image
      run: |

        docker build \
        -t ${{ secrets.DOCKER_USERNAME }}/devops-backend:latest \
        ./backend


    - name: Push Backend Image
      run: |

        docker push \
        ${{ secrets.DOCKER_USERNAME }}/devops-backend:latest



# ==========================
# Frontend Build and Push
# ==========================

  frontend-build:


    name: Frontend Docker Build


    runs-on: ubuntu-latest


    steps:


    - name: Checkout Repository

      uses: actions/checkout@v4



    - name: Verify Frontend Files

      run: |

        ls -la

        ls -la frontend



    - name: Login Docker Hub

      uses: docker/login-action@v3


      with:

        username: ${{ secrets.DOCKER_USERNAME }}

        password: ${{ secrets.DOCKER_PASSWORD }}




    - name: Build Frontend Image

      run: |


        docker build \
        -t ${{ secrets.DOCKER_USERNAME }}/devops-frontend:latest \
        ./frontend




    - name: Push Frontend Image

      run: |


        docker push \
        ${{ secrets.DOCKER_USERNAME }}/devops-frontend:latest