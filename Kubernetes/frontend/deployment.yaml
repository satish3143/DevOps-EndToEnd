apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: devops-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
      - name: frontend

        image: devops-endtoend-frontend:latest

        imagePullPolicy: Never

        ports:
        - containerPort: 3000